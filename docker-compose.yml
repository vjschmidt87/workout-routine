services:
  db:
    image: postgres:16-alpine
    container_name: workout-routine-db
    environment:
      POSTGRES_DB: workoutroutine
      POSTGRES_USER: workoutroutine
      POSTGRES_PASSWORD: workoutroutine
    ports:
      - "5441:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workoutroutine"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: workout-routine-backend
    environment:
      - DB_URL=jdbc:postgresql://db:5432/workoutroutine
      - DB_USER=workoutroutine
      - DB_PASSWORD=workoutroutine
      - JWT_SECRET=workout-routine-jwt-secret-key-change-in-production-must-be-at-least-32-chars
    ports:
      - "8101:8101"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8101/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: workout-routine-frontend
    ports:
      - "4221:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
