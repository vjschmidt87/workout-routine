<nav class="nav">
  <div class="nav__brand">
    <span class="nav__logo">💪</span>
    <span class="nav__name">WorkoutPro</span>
  </div>

  <ul class="nav__links">
    @for (link of links; track link.path) {
      <li>
        <a class="nav__link" [routerLink]="link.path" routerLinkActive="nav__link--active">
          <span class="nav__link-icon">{{ link.icon }}</span>
          <span class="nav__link-label">{{ tr.t(link.key) }}</span>
        </a>
      </li>
    }
  </ul>

  <div class="nav__footer">
    <button class="nav__lang" (click)="toggleLanguage()">
      {{ tr.language() === 'en' ? 'PT-BR' : 'EN' }}
    </button>
    <div class="nav__user">
      <span class="nav__user-name">{{ auth.currentUser()?.name }}</span>
      <button class="nav__logout" (click)="auth.logout()">{{ tr.t('nav.logout') }}</button>
    </div>
  </div>
</nav>
