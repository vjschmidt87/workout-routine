server.port=8101

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5441/workoutroutine}
spring.datasource.username=${DB_USER:workoutroutine}
spring.datasource.password=${DB_PASSWORD:workoutroutine}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

jwt.secret=${JWT_SECRET:workout-routine-jwt-secret-key-change-in-production-32chars}
jwt.expiration-ms=604800000

spring.jackson.serialization.write-dates-as-timestamps=false
